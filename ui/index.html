<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Shiniri</title>
    <script>
      // Sets the theme before first paint so there is no flash. Mirrors readTheme in src/utils/theme.ts.
      var t
      try {
        t = localStorage.getItem('shiniri.theme')
      } catch (e) {}
      var dark =
        t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
