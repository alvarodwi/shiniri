[project]
name = "shiniri-cli"
version = "0.1.0"
description = "Interactive shell to fetch and search NIKKE clear history from blablalink"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-auth>=2.62.2",
    "httpx>=0.28.1",
    "markdownify>=1.2.4",
    "prompt-toolkit>=3.0.53",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
shiniri-cli = "shiniri_cli.cli:run"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
